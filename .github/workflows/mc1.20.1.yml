name: Minecraft 1.20.1 lane

on:
  push:
    branches:
      - version/1.20.1
  pull_request:
    paths:
      - "compatibility/mc1.20.1/**"
      - "shared/**"
      - ".github/workflows/mc1.20.1.yml"

permissions:
  contents: read

jobs:
  java17-gradle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared core and exact platform lane
        working-directory: compatibility/mc1.20.1
        run: bash ./gradlew --no-daemon --stacktrace :shared-core:test :paper:build :fabric:build :forge:build
      - name: Upload experimental artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vidscreen-mc1.20.1
          path: |
            compatibility/mc1.20.1/paper/build/libs/*.jar
            compatibility/mc1.20.1/fabric/build/libs/*.jar
            compatibility/mc1.20.1/forge/build/libs/*.jar
