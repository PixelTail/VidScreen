name: Minecraft 1.16.5 lane

on:
  # Trigger deliberately when CI adds useful exact-Java-8 coverage.
  # Use only standard runners covered by free public-repository Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc1.16.5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  build:
    needs: wrapper-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric
            directory: platforms/mc1.16.5/fabric
          - name: forge
            directory: platforms/mc1.16.5/forge
          - name: paper
            directory: platforms/mc1.16.5/paper
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "8"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build experimental ${{ matrix.name }} lane
        working-directory: ${{ matrix.directory }}
        run: bash ./gradlew --no-daemon build
