name: build

on:
  # Trigger deliberately when CI adds useful clean/cross-platform coverage.
  # Use only standard runners covered by free public-repository Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc1.20.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  java17-gradle:
    needs: wrapper-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build shared, Paper, and Fabric lanes
        working-directory: compatibility/mc1.20.1
        run: >-
          bash ./gradlew --no-daemon --stacktrace
          :shared-core:test :paper:build :fabric:build
      - name: Build Forge lane
        working-directory: compatibility/mc1.20.1
        run: bash ./gradlew --no-daemon --stacktrace :forge:build
      - name: Upload experimental artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vidscreen-mc1.20.1
          path: |
            compatibility/mc1.20.1/paper/build/libs/*.jar
            compatibility/mc1.20.1/fabric/build/libs/*.jar
            compatibility/mc1.20.1/forge/build/libs/*.jar
