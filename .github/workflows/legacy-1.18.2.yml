name: Legacy 1.18.2 lane

on:
  push:
    branches:
      - version/1.18.2
    paths:
      - "platforms/mc1.18.2/**"
      - "shared/**"
      - ".github/workflows/legacy-1.18.2.yml"
  pull_request:
    branches:
      - version/1.18.2
    paths:
      - "platforms/mc1.18.2/**"
      - "shared/**"
      - ".github/workflows/legacy-1.18.2.yml"

permissions:
  contents: read

concurrency:
  group: mc1.18.2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.6"
      - name: Build Fabric and Paper
        run: gradle --no-daemon -p platforms/mc1.18.2 clean build

  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "7.6.4"
      - name: Build ForgeGradle 5.1.77 lane
        run: gradle --no-daemon -p platforms/mc1.18.2/forge clean build
