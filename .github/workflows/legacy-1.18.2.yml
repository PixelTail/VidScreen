name: Legacy 1.18.2 lane

on:
  push:
    branches:
      - version/1.18.2
    paths:
      - 'platforms/mc1.18.2/**'
      - 'shared/**'
      - '.github/workflows/legacy-1.18.2.yml'
  pull_request:
    paths:
      - 'platforms/mc1.18.2/**'
      - 'shared/**'
      - '.github/workflows/legacy-1.18.2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle 8.6
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.6'
          arguments: --no-daemon -p platforms/mc1.18.2 clean build
