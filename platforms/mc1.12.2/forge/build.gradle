buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '0.1.0-SNAPSHOT'
group = 'dev.vidscreen'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2864'
    runDir = 'run'
    mappings = 'snapshot_20171003'
    makeObfSourceJar = false
}

sourceSets {
    main {
        java.srcDirs = [
            'src/main/java',
            '../../../shared/domain/src/main/java',
            '../../../shared/protocol/src/main/java'
        ]
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

jar {
    manifest {
        attributes 'Specification-Title': 'VidScreen',
                'Specification-Vendor': 'vidscreen',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'vidscreen'
    }
}
