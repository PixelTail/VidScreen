import org.gradle.jvm.toolchain.JavaLanguageVersion

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
    }
}

apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDirs(
            '../../../shared/domain/src/main/java',
            '../../../shared/protocol/src/main/java',
            '../../../shared/media-api/src/main/java',
            '../../../shared/client-core/src/main/java',
            '../../../shared/server-core/src/main/java'
        )
    }
}


minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vidscreen {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vidscreen {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.11'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}
